services:
  db:
    image: postgres:16
    container_name: dermscreen-db
    environment:
      POSTGRES_USER: dermscreen_user
      POSTGRES_PASSWORD: "123456aA@"
      POSTGRES_DB: dermscreen
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dermscreen_user -d dermscreen"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dermscreen-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://dermscreen_user:123456aA%40@db:5432/dermscreen
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: http://10.0.2.2:9000
    volumes:
      - ./app:/app/app
      - ./static:/app/static
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  minio:
    image: minio/minio:latest
    container_name: dermscreen-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin123"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-create-bucket:
    image: minio/mc:latest
    container_name: dermscreen-minio-create-bucket
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/dermscreen --ignore-existing;
      /usr/bin/mc anonymous set public myminio/dermscreen;
      exit 0;
      "

volumes:
  db_data:
  minio_data: